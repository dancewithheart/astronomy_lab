[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astronomy-visual"
version = "0.1.0"
description = "Gaia DR3 Orion-region analysis and 3D visualization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy>=7,<8",
    "astroquery>=0.4.10,<1",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "plotly>=6,<7",
    "pyarrow>=18,<24",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.9,<4",
    "scikit-learn>=1.9,<2",
    "umap-learn>=0.5.7,<1",
]
tess = [
    "lightkurve>=2.6,<3",
]
pyvista = [
    "imageio>=2.36,<3",
    "imageio-ffmpeg>=0.5,<1",
    "pyvista>=0.45,<1",
]
dev = [
    "hypothesis>=6,<7",
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools]
py-modules = [
    "astrometry",
    "datasets",
    "gaia",
    "gaia_analysis",
    "gaia_orion_flythrough",
    "gaia_orion_pyvista",
    "gaia_style",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
